name: Android build

# GitHub's ubuntu-latest runners ship with JDK and the Android SDK
# preinstalled, so this is the verification path for the native screen-share
# plugin (ScreenSharePlugin.kt) — this machine has no local Java/Gradle/
# Android SDK to compile it against.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "lib/nativeScreenShare.ts"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "lib/nativeScreenShare.ts"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web app dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marvie-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
